kind: grid
dataset:
  name: qasper
  splits: [dev, test]
# late chunking (ADR 0005, ADR 0007): the production line, nomic only
pipelines: [hybrid-rerank]
embedders: [nomic]
rrf_k: 60
rerank_depth: 30
chunkings:
  # the chunkings late chunking is built on, and the v2 baseline's best single chunking
  - {name: fixed-128, method: fixed, chunk_tokens: 128}
  - {name: fixed-256, method: fixed, chunk_tokens: 256}
  - {name: section-aware, method: section_aware, max_tokens: 512}
  # the same spans as fixed-128 and fixed-256, vectors pooled from whole-document token embeddings
  - {name: late-128, method: fixed, chunk_tokens: 128, embedding: late}
  - {name: late-256, method: fixed, chunk_tokens: 256, embedding: late}
budgets: [128, 256, 512, 1024, 2048, 4096, 8192]
top_n: 8
side_top_n: 5
# the budget view (ADR 0006): at most 20 reranked whole chunks per question
budget_top_n: 20
scopes: [collection]
fixed_k: [1, 5, 10]
search_depth: 1000
seed: 0
run_name: v2-late
# packed spans for the reader (v2's primary cell: budget view, 1024 tokens)
export_packed:
  - {view: budget, budget: 1024, scope: collection}
