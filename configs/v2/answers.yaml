kind: answers
run_name: v2-answers
dataset:
  name: pooled
  sources:
    - {name: qasper, splits: [dev, test]}
    - {name: nq, splits: [dev]}
sample: configs/v2/reader-sample.txt
# every setup reads the same cell of its runs' packed.parquet: the budget
# view's primary cell (ADR 0006), 1024 tokens, collection search
view: budget
budget: 1024
top_n: 20
scope: collection
pipeline: hybrid-rerank
embedder: nomic
# smallest chunk first: the oracle router's tie-break order, as configs/v2/budget-view.yaml
oracle_chunkings: [fixed-64, fixed-128, fixed-256, fixed-512, section-aware, small-to-big, fixed-1024]
# three setups only (ADR 0009, amended 2026-10-17): no contender reached the
# retrieval bar, so this stage asks whether better retrieval moves answers
setups:
  - name: section-aware
    runs: {qasper: v2-baseline, nq: v2-baseline}
    chunking: section-aware
  # per question, the chunking with the highest recall at the cell, ties to
  # the smaller chunk, read from the baseline runs
  - name: oracle
    kind: oracle
    runs: {qasper: v2-baseline, nq: v2-baseline}
  # the no-retrieval floor: the closed-book variant of the prompt
  - name: no-retrieval
    kind: none
# the local reader: Qwen3-8B, 4-bit MLX weights at the revision the context
# prefixes used; thinking off, greedy decoding, one prompt at a time
reader:
  model:
    id: mlx-community/Qwen3-8B-4bit
    revision: 545dc4251c05440727734bcd94334791f6ab0192
  max_new_tokens: 256
# the model-graded check: 50 questions per dataset x 3 setups = 300 answers,
# graded through the `claude` command-line tool; the prompt was committed
# before any answer existed and the run fails if it stops matching this hash
grader:
  model: claude-sonnet-5-5
  effort: medium
  prompt: configs/v2/grader-prompt.txt
  prompt_sha256: 8e1445fd3f77ee8252a32e3898c30813dc5d9192406c1fc799e9bc7a84b63c65
  questions_per_dataset: 50
  seed: 0
  pause_seconds: 5
  max_attempts: 4
  threshold: 0.5
resamples: 10000
seed: 0
confidence: 0.95
