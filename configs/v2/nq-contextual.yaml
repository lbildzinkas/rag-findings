kind: grid
dataset:
  name: nq
  splits: [dev]
# contextual chunks (ADR 0005, ADR 0009): the production line, nomic only
pipelines: [hybrid-rerank]
embedders: [nomic]
rrf_k: 60
rerank_depth: 30
chunkings:
  # the chunking the prefixes were written for, and the v2 baseline's best single chunking
  - {name: fixed-256, method: fixed, chunk_tokens: 256}
  - {name: section-aware, method: section_aware, max_tokens: 512}
  # fixed-256's spans, searched by prefix + blank line + chunk text (configs/prefixes.yaml's
  # prefix set); packing, scoring and the reader use the chunk text only
  - name: contextual-256
    method: fixed
    chunk_tokens: 256
    prefixes: &prefixes
      model: mlx-community/Qwen3-8B-4bit
      revision: 545dc4251c05440727734bcd94334791f6ab0192
      prompt_sha256: 1f90604cbe2d345af3d3eb34108a12fb47626e6416e5dbdf9c39786f77bfef44
  # the side variant: the same ranking, packing counts prefix + chunk tokens and the reader receives both
  - name: contextual-256-prefixed
    method: fixed
    chunk_tokens: 256
    prefixes: *prefixes
    prefix_in_budget: true
budgets: [128, 256, 512, 1024, 2048, 4096, 8192]
top_n: 8
side_top_n: 5
# the budget view (ADR 0006): at most 20 reranked whole chunks per question
budget_top_n: 20
scopes: [collection]
fixed_k: [1, 5, 10]
search_depth: 1000
seed: 0
run_name: v2-contextual
# packed spans for the reader (v2's primary cell: budget view, 1024 tokens)
export_packed:
  - {view: budget, budget: 1024, scope: collection}
