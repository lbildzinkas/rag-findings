[project]
name = "rag-findings"
version = "0.1.0"
description = "RAG chunking retrieval experiments: labelled spans, budget packing, retrieval recall and precision"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "lancedb>=0.40",
    "tiktoken>=0.13",
    "pyyaml>=6.0",
    "chonkie>=1.7",
    "numpy>=2.0",
    "sentence-transformers>=5.0,<6",
    # nomic-embed-text-v1.5's remote code fails under transformers 5.x;
    # 4.48 is the floor gte-reranker-modernbert-base (ModernBERT) needs
    "transformers>=4.48,<5",
    "einops>=0.8",  # nomic-embed-text-v1.5's remote code imports it
    "huggingface-hub>=0.34",
    "torch>=2.5",
]

[project.scripts]
rag = "rag.cli:main"

[dependency-groups]
dev = [
    "pytest>=8.0",
    "ruff>=0.14",
]
# `rag prefixes` only, on Apple silicon; mlx-lm 0.29.1 is the newest release
# that accepts transformers 4.x (0.30 and later need transformers 5)
prefixes = [
    "mlx==0.30.1 ; sys_platform == 'darwin'",
    "mlx-lm==0.29.1 ; sys_platform == 'darwin'",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/rag"]

# CPU-only torch wheels on Linux (CI) instead of the multi-GB CUDA build;
# macOS wheels on PyPI already include MPS
[tool.uv.sources]
torch = [{ index = "pytorch-cpu", marker = "sys_platform == 'linux'" }]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.pytest.ini_options]
testpaths = ["tests"]
