[project]
name = "rag-findings"
version = "0.1.0"
description = "RAG chunking retrieval experiments: labelled spans, budget packing, retrieval recall and precision"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "lancedb>=0.40",
    "tiktoken>=0.13",
    "pyyaml>=6.0",
]

[project.scripts]
rag = "rag.cli:main"

[dependency-groups]
dev = [
    "pytest>=8.0",
    "ruff>=0.14",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/rag"]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.pytest.ini_options]
testpaths = ["tests"]
